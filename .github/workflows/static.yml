# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      # Publish only site files. CLAUDE.md, README.md, scripts/ and editor config stay in the repo.
      - name: Build site folder
        run: |
          mkdir _site
          cp -R index.html blog assets robots.txt sitemap.xml llms.txt favicon.ico favicon.svg favicon-48.png favicon-96.png apple-touch-icon.png og.png umut-celik.jpg Umut_Celik_Resume.pdf ea8f0f8641dd7400a340ef19b9359779.txt _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # Tell Bing (and through it ChatGPT search and Copilot) and other IndexNow engines what changed.
      - name: Notify IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: ea8f0f8641dd7400a340ef19b9359779
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's/<loc>//' -e 's#</loc>##' | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"umutcelik.com.tr\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://umutcelik.com.tr/$INDEXNOW_KEY.txt\",\"urlList\":$urls}" \
            -o /dev/null -w 'IndexNow HTTP %{http_code}\n'
